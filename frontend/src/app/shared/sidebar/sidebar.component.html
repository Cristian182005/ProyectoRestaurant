<div class="backdrop" [class.visible]="open" (click)="close.emit()" aria-hidden="true"></div>

<aside class="sidebar" [class.open]="open" aria-label="Navegación principal">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">H</span>
    <div class="brand-text">
      <span class="brand-title">El Hornero</span>
      <span class="brand-subtitle">INVERSIONES EL HORNERO S.A.C.</span>
    </div>
  </div>

  <nav class="nav">
    @for (item of navItems; track item.label) {
      <button
        type="button"
        class="nav-item"
        [class.active]="activeSection === item.label"
        (click)="selectSection(item)"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          @for (path of item.icon; track path) {
            <path [attr.d]="path" />
          }
        </svg>
        <span>{{ item.label }}</span>
      </button>
    }
  </nav>

  <div class="profile">
    <span class="avatar" aria-hidden="true"></span>
    <div class="profile-text">
      <span class="profile-name" [attr.title]="sesion.email() ?? ''">
        {{ sesion.email() ?? 'Sin sesión' }}
      </span>
      <span class="profile-role">{{ sesion.rol() ?? '' }}</span>
    </div>
    <button
      type="button"
      class="logout"
      (click)="selectLogout()"
      aria-label="Cerrar sesión"
      title="Cerrar sesión"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
    </button>
  </div>
</aside>
